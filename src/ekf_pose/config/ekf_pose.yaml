# Wildcard, not a node name: this file was keyed 'ekf_pose_node:' while the node
# actually calls itself 'ekf_pose_estimator', so ROS silently ignored the whole
# file and every value below fell back to the declare_parameter() default in
# ekf_pose_estimator.cpp. Two of those defaults are the opposite of what is
# wanted here -- imu_axis_yaw180 (true, meant for the old flipped bags) and
# publish_tf (true, which fights MCL for map->base_link). Keep '/**' so a future
# node rename cannot re-break this the same way.
/**:
  ros__parameters:

    # ── 출력 설정 ────────────────────────────────────────────
    publish_rate: 200.0        # [Hz] EKF 위치 출력 Hz (IMU 기반 예측으로 고속 가능)
    publish_tf:   false         # map → base_link TF 발행 여부
    map_frame:    "map"
    base_frame:   "base_link"

    # ── 토픽 이름 ────────────────────────────────────────────
    # [철회됨 — 2026-08-21] 2026-08-04 에 0730 3호차 bag 으로 "두 토픽의 축 컨벤션이
    # 동일하다(중력보상 노드가 축은 안 건드림)"고 결론내고 /ekf/imu/data 를 골랐다.
    # 그 관측 자체는 3호차에서 맞았지만 **일반화가 틀렸다** — 아래 4호차 실측 참고.
    # 2026-08-21: /ekf/imu/data -> /imu/data. 4호차 0821 bag 실측으로 /ekf/imu/data 는
    # 중력만 보상된 게 아니라 **축까지 돌아간** 토픽임이 확인됐다 (GT yaw rate 대비):
    #     /ekf/imu/data : 자이로z 기울기 -0.980,  가속도y 기울기 -1.095,  정지 a_z +0.01
    #     /imu/data     : 자이로z 기울기 +0.980,  가속도y 기울기 +1.030,  정지 a_z +9.79
    # 반전된 자이로로 predict 하니 yaw 가 ±60도씩 날아다녔다 — 같은 bag ZOH A/B 에서
    # 위치 MAE +107%, yaw MAE 29.95도(+1450%). 토픽만 /imu/data 로 바꾸자 위치 -14.2%,
    # yaw -13.0% 로 부호가 뒤집혔다. MCL 이 멀쩡했던 건 처음부터 /imu/data 를 쓰기 때문.
    #
    # ⚠️ 이 축 규약은 **차량마다 다르다**. 0730 3호차 bag 에서는 /ekf/imu/data 와
    # /imu/data 의 자이로z 부호가 같았다(둘 다 정상). 즉 /ekf/imu/data 를 만드는
    # 노드가 셋업마다 다르게 동작한다 — 다른 차에 올리기 전 반드시 GT 대비 부호를
    # 재확인할 것 (docs §2 가 경고했던 바로 그 함정이다).
    #
    # 대가: /imu/data 는 중력 포함(정지 a_z +9.79)이라 가감속 피치에서 중력이 a_x 로
    # 누설된다. vx 는 odom 으로 보정되므로 영향은 제한적이지만, 축이 검증된
    # 중력보상 토픽이 생기면 그쪽이 더 낫다.
    imu_topic:       "/imu/data"  # 고속 IMU (중력 포함, 축 검증됨 — 위 주석 참고)
    odom_topic:      "/odom"         # 휠 오도메트리 (속도 보정용)
    mcl_pose_topic:  "/newmcl_pose"  # 파티클 필터 위치 (mcl_params.yaml의 pose_name과 일치해야 함)

    # ── 속도 업데이트 사용 여부 ───────────────────────────────
    use_odom_vel: true

    # ════════════════════════════════════════════════════════
    #  2026-08-03 실차 bag + mocap GT 검증으로 추가
    #  (docs/ekf-pose-analysis-2026-08.md)
    # ════════════════════════════════════════════════════════
    # 과거 3호차 bag은 ax/ay가 반전돼 이 값을 true로 사용했다. 현재 3호차는
    # IMU firmware sensor2vehicle=identity + 드라이버 roll180 publisher 보정으로
    # /imu/data가 차체 FLU 기준임을 imu_frame_test로 검증했다.
    # ⚠ 과거 bag 재생이나 IMU 장착/드라이버 변경 시에만 true를 검토하고, 반드시
    #   imu_frame_test로 세 축 부호를 재검증할 것.
    imu_axis_yaw180: false

    # /odom 의 angular.z 는 측정이 아니라 vesc_to_odom 의 운동학 재구성이다.
    # 실측: 코너에서 실제의 0.70~0.80배, 115ms 지연. (IMU 자이로는 0.85~0.95배, 5~15ms)
    # 융합하면 좋은 자이로 값이 끌려 내려가므로 기본 제외.
    # 실측 개선: 위치 p50 9.37→8.52cm, yaw p50 3.20°→2.17°, p90 7.80°→5.08°
    use_odom_yaw_rate: false

    # ════════════════════════════════════════════════════════
    #  프로세스 노이즈 Q  (값이 클수록 모델을 덜 믿음)
    #  → 실제 주행 시 IMU 바이어스·미끄러짐에 따라 조절
    # ════════════════════════════════════════════════════════
    q_pos:       0.01    # 위치 프로세스 노이즈 [m²/s]
    q_vel:       0.5     # 속도 프로세스 노이즈 [m²/s³]
    q_yaw:       0.01    # 헤딩 프로세스 노이즈 [rad²/s]
    q_yaw_rate:  0.3     # 회전 속도 프로세스 노이즈 [rad²/s³]

    # ════════════════════════════════════════════════════════
    #  측정 노이즈 R  (값이 클수록 해당 센서를 덜 믿음)
    # ════════════════════════════════════════════════════════
    # MCL Pose: SLAM/파티클 필터 결과 — 절대 위치 기준
    #
    # 2026-08-20: 0.05 → 0.01. 0.05 는 1σ=22 cm 를 뜻하는데 실측 MCL 오차는 p50
    # 9~10 cm 라, 필터가 좋은 측정을 실제보다 2배 이상 못 믿고 예측 쪽으로 끌려갔다.
    # 그 예측 경로는 §4 에서 이미 "IMU 로 v_y 를 얻을 수 없다"고 결론난 바로 그
    # 경로다. 0820 고속 bag(car4) 에서 같은 순간 MCL 이 0.003~0.022 m 인데 EKF 는
    # 0.23~0.34 m 로 벌어지는 구간이 반복됐다.
    #
    # 0820 bag, control 관점(ZOH) A/B — 이 한 줄만 바꾼 결과:
    #   r_mcl_pos 0.05 : 위치 MAE **+37%** (EKF 가 더 나쁨), yaw −12%
    #   r_mcl_pos 0.01 : 위치 MAE **−16%** (EKF 가 더 좋음), yaw −8~9%
    # r_mcl_yaw 도 같은 이유로 0.02(1σ=8.1°) → 0.005(1σ=4.1°), 실측 yaw 오차
    # 3.6~4.2° 에 맞춤.
    #
    # ⚠ 이 값은 "MCL 이 얼마나 정확한가"에 연동된다. scan_step/particle_num 을
    # 바꾸거나 맵/속도가 크게 달라지면 MCL 오차부터 다시 재고 여기에 맞출 것.
    r_mcl_pos:   0.01    # MCL 위치 측정 노이즈 [m²] (1σ=10cm, 실측 p50 9~10cm)
    r_mcl_yaw:   0.005   # MCL 헤딩 측정 노이즈 [rad²] (1σ=4.1°, 실측 3.6~4.2°)

    # Odometry: 휠 오도메트리 속도
    r_odom_vel:       0.1    # 속도 측정 노이즈 [m²/s²]
    r_odom_yaw_rate:  0.05   # 각속도 측정 노이즈 [rad²/s²]

    # yaw_rate 상태를 IMU 로 직접 대입한 직후 공분산 리셋값 (§7.1 정합성 수정).
    # ekf-pose-analysis-2026-08.md §6 실측 RMSE(0.34~0.40 rad/s, mocap 미분
    # 노이즈 포함이라 상한치)의 제곱에서 시작. 실차에서 EKF 경로가 켜지면
    # yaw 공분산/칼만게인 튜닝하며 같이 조정할 것.
    r_gyro_yaw_rate:  0.14   # 자이로 yaw_rate 측정 노이즈 [rad²/s²]

    # ════════════════════════════════════════════════════════
    #  MCL pose 지연 보상 (retrodiction, §7.3/P3)
    # ════════════════════════════════════════════════════════
    # 0730 bag(22:52:38) A/B 실측 결과 이득 확인 안 됨 — p50/p90 오히려 소폭
    # 악화(yaw만 개선). 이 bag엔 애초에 고칠 편향이 없었음(이미 +0.4cm).
    # docs/ekf-pose-analysis-2026-08.md §11 참고. 기본 꺼둠, 코드/파라미터는
    # 다른 시나리오(느린 MCL, 비동기 조회 패턴 등) 재평가용으로 유지.
    retrodiction_enabled: false
    retrodiction_window:  0.5     # [s] 켤 경우 보관할 히스토리 길이
