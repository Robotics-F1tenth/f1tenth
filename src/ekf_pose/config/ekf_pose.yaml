ekf_pose_node:
  ros__parameters:

    # ── 출력 설정 ────────────────────────────────────────────
    publish_rate: 200.0        # [Hz] EKF 위치 출력 Hz (IMU 기반 예측으로 고속 가능)
    publish_tf:   true         # map → base_link TF 발행 여부
    map_frame:    "map"
    base_frame:   "base_link"

    # ── 토픽 이름 ────────────────────────────────────────────
    imu_topic:       "/imu/data"     # 고속 IMU (보통 100-400 Hz)
    odom_topic:      "/odom"         # 휠 오도메트리 (속도 보정용)
    mcl_pose_topic:  "/mcl_pose"     # 파티클 필터 위치 (느리지만 절대 정확도 높음)

    # ── 속도 업데이트 사용 여부 ───────────────────────────────
    use_odom_vel: true

    # ════════════════════════════════════════════════════════
    #  프로세스 노이즈 Q  (값이 클수록 모델을 덜 믿음)
    #  → 실제 주행 시 IMU 바이어스·미끄러짐에 따라 조절
    # ════════════════════════════════════════════════════════
    q_pos:       0.01    # 위치 프로세스 노이즈 [m²/s]
    q_vel:       0.5     # 속도 프로세스 노이즈 [m²/s³]
    q_yaw:       0.01    # 헤딩 프로세스 노이즈 [rad²/s]
    q_yaw_rate:  0.3     # 회전 속도 프로세스 노이즈 [rad²/s³]

    # ════════════════════════════════════════════════════════
    #  측정 노이즈 R  (값이 클수록 해당 센서를 덜 믿음)
    # ════════════════════════════════════════════════════════
    # MCL Pose: SLAM/파티클 필터 결과 — 절대 위치 기준
    r_mcl_pos:   0.05    # MCL 위치 측정 노이즈 [m²]
    r_mcl_yaw:   0.02    # MCL 헤딩 측정 노이즈 [rad²]

    # Odometry: 휠 오도메트리 속도
    r_odom_vel:       0.1    # 속도 측정 노이즈 [m²/s²]
    r_odom_yaw_rate:  0.05   # 각속도 측정 노이즈 [rad²/s²]
