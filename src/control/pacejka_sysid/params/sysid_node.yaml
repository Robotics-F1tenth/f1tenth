# Adapted from ForzaETH On-Track-SysID (github.com/ForzaETH/On-Track-SysID), arXiv:2411.17508
#
# 신규 파일 — ROS 2 노드 인터페이스 파라미터. 원본에는 대응물이 없다
# (원본은 launch/sys_id.launch 안에 5개 param 을 직접 박아 두었다).
#
# 학습 하이퍼파라미터는 여기가 아니라 params/nn_params.yaml 과
# params/pacejka_params.yaml 에 있다 (원본 파일 그대로 유지).
#
# smppi_cuda_controller/config/params.yaml 과 같은 '/**:' 와일드카드 형식을 쓴다.
# 노드 이름이 바뀌어도 파라미터가 조용히 무시되지 않게 하기 위함
# (ekf_pose/config/ekf_pose.yaml 이 정확히 이 문제로 로드되지 않고 있다:
#  키는 'ekf_pose_node' 인데 실제 노드 이름은 'ekf_pose_estimator').
/**:
  ros__parameters:

    # ── 차량 / 산출물 ────────────────────────────────────────────
    racecar_version: "F1TENTH"          # models/<이름>/<이름>_pacejka.txt 를 찾는다. 밑줄(_) 금지
    save_LUT_name: "F1TENTH_on_track_pacejka"
    output_dir: "~/.ros/pacejka_sysid"  # 식별 결과 / CSV / 그림이 쌓이는 곳

    # ── 토픽 ─────────────────────────────────────────────────────
    # state_source = "imu_odom" : v_x <- odom_topic, (omega, a_y) <- imu_topic  [실차 기본]
    # state_source = "odom"     : (v_x, v_y, omega) <- odom_topic 하나에서 [원본과 동일 경로]
    #                             시뮬레이터 /odom0 또는 /ekf_odom 검증용
    state_source: "imu_odom"
    odom_topic: "/odom"                 # vesc_ackermann/vesc_to_odom_node
    imu_topic: "/imu/data"              # microstrain_inertial_driver (100 Hz)
    ackermann_topic: "/ackermann_cmd"   # ackermann_mux 출력 = 실제 인가된 조향 명령

    # ── IMU 기반 v_y 조립기 (state_source="imu_odom" 일 때만) ────
    # 목표 좌표계는 FLU (x=전방, y=좌측, z=상방, +omega=좌회전, 정지 시 a_z=+9.81).
    # 이 워크스페이스의 MicroStrain 센서는 축은 FLU 로 내보내지만 가속도 부호가
    # REP-145 표준과 반대다 (실측: 정지 시 a_z=-9.81). als_ros/mcl.launch.py:48 도
    # 같은 /imu/data 에 대해 이미 180 을 기본값으로 쓴다. 다른 하드웨어/장착
    # 상태라면 다를 수 있으니 반드시 아래로 검증할 것:
    #   1) 차 정지 상태에서 a_z ≈ +9.81 이면 roll=0, ≈ -9.81 이면 roll=180.
    #   2) 좌회전(delta>0) 중 조립된 omega 가 양수인지.
    # (state_assembler.py 상단 주석, README "문제 해결" 참고)
    #
    # ⚠ 2026-08 0730 bag 세션 데이터엔 이 기본값(180)이 안 맞는다 — 정지 시
    # a_z=+9.76 실측(위 기준 1번대로면 roll=0). 대신 이 세션은 ax,ay 가
    # (roll 이 아니라) **yaw 180도**로 반전돼 있었다(ekf_pose 쪽에서 mocap GT
    # 회귀로 확인, ekf_pose/docs/ekf-pose-analysis-2026-08.md §2/§2.5 — 같은
    # 문서에서 물리적 역장착 가설은 육안확인으로 기각, 원인은 드라이버/펌웨어
    # 축 컨벤션으로 추정). 즉 이 값 180 은 "REP-145 어긋남의 일반 기본값"일 뿐,
    # 현재 실차 세션엔 그대로 안 맞을 수 있음 — 사용 전 위 1)/2) 재검증 필수.
    imu_rotation_roll: 180.0            # deg
    imu_rotation_pitch: 0.0             # deg
    imu_rotation_yaw: 0.0               # deg
    vy_washout_tau: 2.0                 # s, v_y 적분 드리프트 억제 시정수
    imu_to_cog_x: 0.0                   # m, IMU 장착점의 CoG 대비 세로 오프셋 [미실측]
    bias_calib_samples: 200             # 정지 상태에서 a_y / omega 바이어스를 뽑을 샘플 수
    standstill_speed: 0.05              # m/s, 이 아래를 '정지'로 본다

    # ── 수집 / 학습 동작 ─────────────────────────────────────────
    min_collect_speed: 1.0              # m/s, 원본 하드코딩 'v_x > 1' 과 동일
    plot_model: true                    # 매 이터레이션마다 그림 표시 (원본과 동일)
    save_plots: true                    # 그림을 output_dir 에 png 로 저장 (headless 대응)
    export_csv: true                    # 수집 데이터를 CSV 로 덤프
    prompt_before_export: false         # true 면 원본처럼 stdin 으로 'Y' 를 묻는다
    generate_lut: false                 # 조향 LUT 생성. ForzaETH MAP 컨트롤러 전용이라 기본 off
