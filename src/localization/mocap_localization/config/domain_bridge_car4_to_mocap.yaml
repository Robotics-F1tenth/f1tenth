# Central-recording bridge: car 4 Jetson domain (11) -> bridge PC domain (10).
# Keep the controller inputs, commands, VESC state, and path/boundary inputs so
# a bridge-PC bag can replay/analyse the live SMPPI decision context.  Deliberately
# exclude /mppi_viz: it contains the top candidate rollouts every control cycle
# and is high-volume.  The lightweight /mppi_boundary_viz is retained for
# boundary-slack diagnostics.
name: car4_11_to_mocap_10
from_domain: 11
to_domain: 10
topics:
  newmcl_pose:
    type: geometry_msgs/msg/PoseStamped
    remap: car4/newmcl_pose
  f1/perception/object/obstacles/arr:
    type: f1_msgs/msg/F1stateArr
    remap: car4/f1/perception/object/obstacles/arr
  drive:
    type: ackermann_msgs/msg/AckermannDriveStamped
    remap: car4/drive
  teleop:
    type: ackermann_msgs/msg/AckermannDriveStamped
    remap: car4/teleop
  ackermann_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    remap: car4/ackermann_cmd
  ackermann_drive:
    type: ackermann_msgs/msg/AckermannDriveStamped
    remap: car4/ackermann_drive
  odom:
    type: nav_msgs/msg/Odometry
    remap: car4/odom
  ekf/imu/data:
    type: sensor_msgs/msg/Imu
    remap: car4/ekf/imu/data
  imu/data:
    type: sensor_msgs/msg/Imu
    remap: car4/imu/data
  scan:
    type: sensor_msgs/msg/LaserScan
    remap: car4/scan
    qos:
      history: keep_last
      depth: 5
      reliability: best_effort
      durability: volatile
  map:
    type: nav_msgs/msg/OccupancyGrid
    qos:
      history: keep_last
      depth: 1
      reliability: reliable
      durability: transient_local
  tf:
    type: tf2_msgs/msg/TFMessage
    # The deployed car4 /tf publisher and the Humble tf2 listener are both
    # reliable.  Preserve that contract across the domain bridge.
    qos:
      history: keep_last
      depth: 100
      reliability: reliable
      durability: volatile
  tf_static:
    type: tf2_msgs/msg/TFMessage
    qos:
      history: keep_last
      # Retain static transforms from all publishers (laser, IMU, etc.) for
      # late RViz/tf2 subscribers; depth 1 can leave only the last TFMessage.
      depth: 100
      reliability: reliable
      durability: transient_local
  parameter_events:
    type: rcl_interfaces/msg/ParameterEvent
    remap: car4/parameter_events
  f1/perception/static_obstacles:
    type: f1_msgs/msg/F1stateArr
    remap: car4/f1/perception/static_obstacles
  fsm/state:
    type: std_msgs/msg/String
    remap: car4/fsm/state
  # /mppi_optimal_trajectory intentionally cannot be bridged here.  Its custom
  # MppiTrajectory type currently lives inside the CUDA-only
  # smppi_cuda_controller package, which is not installed on this Humble
  # recording PC.  The standard-topic inputs/commands below still provide the
  # controller decision context.  Record that custom topic locally on car4
  # only when it is specifically needed, or split the message into a portable
  # interface package and install it on both hosts.
  commands/motor/speed:
    type: std_msgs/msg/Float64
    remap: car4/commands/motor/speed
  commands/servo/position:
    type: std_msgs/msg/Float64
    remap: car4/commands/servo/position
  sensors/servo_position_command:
    type: std_msgs/msg/Float64
    remap: car4/sensors/servo_position_command
  sensors/core:
    type: vesc_msgs/msg/VescStateStamped
    remap: car4/sensors/core
  mppi_target_path:
    type: nav_msgs/msg/Path
    remap: car4/mppi_target_path
  mppi_left_boundary:
    type: nav_msgs/msg/Path
    remap: car4/mppi_left_boundary
  mppi_right_boundary:
    type: nav_msgs/msg/Path
    remap: car4/mppi_right_boundary
  mppi_boundary_viz:
    type: visualization_msgs/msg/MarkerArray
    remap: car4/mppi_boundary_viz
    qos:
      history: keep_last
      depth: 5
      reliability: reliable
      durability: transient_local
  center_path:
    type: nav_msgs/msg/Path
    remap: car4/center_path
  left_boundary:
    type: nav_msgs/msg/Path
    remap: car4/left_boundary
  right_boundary:
    type: nav_msgs/msg/Path
    remap: car4/right_boundary
